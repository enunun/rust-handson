plugins:
  '@textlint/markdown': true

rules:
  # 技術文書の文体(文の長さ，読点の数，常体の統一，弱い表現など)．
  preset-ja-technical-writing:
    # 文章の長さは，1文あたり150文字以内にする．
    sentence-length:
      max: 150

    # 本文と箇条書きを，常体(である調)にそろえる．見出しは指定しない．
    no-mix-dearu-desumasu:
      preferInHeader: ''
      preferInBody: 'である'
      preferInList: 'である'
      strict: false

    # 読点は「，」，句点は「．」を使う．
    max-ten:
      touten: '，'
      kuten: '．'

    ja-no-mixed-period:
      periodMark: '．'

  # 和文の中のコロンを全角にし，読点と句点を「，」と「．」にする．辞書は.textlint-prh.ymlに書く．
  prh:
    rulePaths:
      - ./.textlint-prh.yml

  # 和文と欧文の間，和文とインラインコードの間には，スペースを入れない．
  preset-ja-spacing:
    ja-space-between-half-and-full-width:
      space: never

    ja-space-around-code:
      before: false
      after: false

  # AIが書いたように見える表現(機械的な箇条書き，誇張，強調の乱用など)．
  '@textlint-ja/preset-ai-writing': true